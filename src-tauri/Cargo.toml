[package]
name = "kokin-osint"
description = "Local-first desktop OSINT investigation workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# Tauri 2 mobile-compatible layout: the app lives in a lib, main.rs is a shim.
name = "kokin_osint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kokin-store = { path = "../crates/kokin-store" }
kokin-keys = { path = "../crates/kokin-keys" }
kokin-blob = { path = "../crates/kokin-blob" }
kokin-search = { path = "../crates/kokin-search" }
kokin-graph = { path = "../crates/kokin-graph" }
kokin-ingest = { path = "../crates/kokin-ingest" }
kokin-extract = { path = "../crates/kokin-extract" }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# No kokin-net in [dependencies]. Ingesting a URL needs an HttpCapability, and
# there is no live HTTP client in this workspace to be one — see
# views::IngestFileRequest. It appears below as a dev-dependency only, so the
# acceptance test can hand `ingest_url` a ReplayHttp; nothing shipped can reach
# it, and the CI import lint holds regardless.

[dev-dependencies]
# The acceptance test walks the whole reference workflow, so it needs the two
# ends the command layer does not expose yet: step 2 (ingest_url, which takes an
# HttpCapability) and step 10 (export/restore).
kokin-net = { path = "../crates/kokin-net" }
kokin-export = { path = "../crates/kokin-export" }
blake3 = "1.5"
