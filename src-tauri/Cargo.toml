[package]
name = "kokin-osint"
description = "Local-first desktop OSINT investigation workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# Tauri 2 mobile-compatible layout: the app lives in a lib, main.rs is a shim.
name = "kokin_osint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kokin-store = { path = "../crates/kokin-store" }
kokin-keys = { path = "../crates/kokin-keys" }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
