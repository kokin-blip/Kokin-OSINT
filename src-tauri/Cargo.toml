[package]
name = "kokin-osint"
description = "Local-first desktop OSINT investigation workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# Tauri 2 mobile-compatible layout: the app lives in a lib, main.rs is a shim.
name = "kokin_osint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
desktop-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri-plugin-wdio = {version="1",optional=true}
tauri-plugin-wdio-webdriver = {version="1",optional=true}
kokin-store = { path = "../crates/kokin-store" }
kokin-keys = { path = "../crates/kokin-keys" }
kokin-blob = { path = "../crates/kokin-blob" }
kokin-search = { path = "../crates/kokin-search" }
kokin-graph = { path = "../crates/kokin-graph" }
kokin-ingest = { path = "../crates/kokin-ingest" }
kokin-extract = { path = "../crates/kokin-extract" }
kokin-net = { path = "../crates/kokin-net" }
kokin-export = { path = "../crates/kokin-export" }
rfd = "0.15"
getrandom = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Backend acceptance remains window-free; desktop acceptance exercises the
# collection and package controls separately with debug-only fixtures.
blake3 = "1.5"
