[package]
name = "kokin-faces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
inference = ["dep:ort", "dep:ort-sys", "dep:image"]

[dependencies]
base64 = "0.22"
serde = {version="1",features=["derive"]}
serde_json = "1"
thiserror = "2"
ort = {version="=2.0.0-rc.10",default-features=false,features=["load-dynamic"],optional=true}
ort-sys = {version="=2.0.0-rc.10",default-features=false,optional=true}
image = {version="=0.25.6",default-features=false,features=["png","jpeg"],optional=true}
