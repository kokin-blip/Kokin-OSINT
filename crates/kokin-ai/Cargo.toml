[package]
name = "kokin-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
thiserror = "2"
kokin-store = {path="../kokin-store"}
rusqlite = {version="0.40.2",features=["bundled-sqlcipher-vendored-openssl"]}
getrandom = "0.4"
ort = {version="=2.0.0-rc.10",default-features=false,features=["load-dynamic"]}
ort-sys = {version="=2.0.0-rc.10",default-features=false}
tokenizers = {version="=0.21.4",default-features=false,features=["onig"]}

kokin-search = {path="../kokin-search"}
