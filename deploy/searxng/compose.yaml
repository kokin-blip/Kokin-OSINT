# Explicit opt-in service. Upstream search queries leave this computer.
services:
  searxng:
    image: searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8088/
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
