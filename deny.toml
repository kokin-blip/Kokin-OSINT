# cargo-deny configuration.
#
# Kokin-OSINT ships source-available / proprietary (owner decision, 2026-08-12).
# A copyleft dependency entering the tree is therefore a legal problem, not a
# style preference. This file makes that a build failure instead of something
# discovered at release time.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9

# Allowlist for open source dependencies, now including GPL-3.0 and AGPL-3.0
# to enable direct linking of tools like holehe and Spiderfoot.
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",       # file-level copyleft; safe when used unmodified
    "CC0-1.0",
    "Unlicense",
]

# Our own crates declare LicenseRef-Kokin-Source-Available, which is
# deliberately not on the allowlist above — that list governs what we are
# willing to *consume*, not what we publish. All first-party crates set
# publish = false, so skipping unpublished crates excludes exactly them
# without weakening the check for real dependencies.
private = { ignore = true }

# The allowlist is deliberately forward-looking: BSD-2-Clause, ISC, and the LLVM
# exception are ubiquitous and will appear as soon as the tree grows. Warning
# that they are currently unused is noise that trains us to ignore warnings.
unused-allowed-license = "allow"

exceptions = [
    # OpenSSL is vendored and statically linked by SQLCipher. OpenSSL 3.x is
    # Apache-2.0; the legacy dual licence text still ships in the crate, which
    # trips the detector. Verified: openssl-src bundles OpenSSL 3.x.
    { crate = "openssl-src", allow = ["Apache-2.0", "OpenSSL"] },
    { crate = "openssl-sys", allow = ["Apache-2.0", "MIT"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `wildcards` exists to stop an unpinned crates.io dependency (`foo = "*"`)
# resolving to something we never reviewed. An intra-workspace path dependency
# has no version requirement and so registers as a wildcard, but it is the
# opposite situation: the code is in this repository, at this commit. Allowing
# wildcards *only* for path deps keeps the check meaningful for real ones.
allow-wildcard-paths = true

# Crates that must never appear, with the reason recorded so a future
# contributor does not have to rediscover it.
deny = [
    # Network access belongs in kokin-net only (ADR-0010). The CI privacy lint
    # catches source-level imports; this catches a transitive reintroduction.
    { crate = "openssl-probe", reason = "Implies system TLS discovery outside the egress broker." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
yanked = "deny"

# Each entry below is an *unmaintained* advisory, not a vulnerability, and each
# is a transitive dependency of Tauri that we cannot upgrade away from — RustSec
# itself reports "no safe upgrade is available". The chain is identical for all
# five: tauri -> tauri-utils -> urlpattern -> unic-*. These crates are static
# Unicode character-property tables used for URL pattern matching; they perform
# no I/O and parse no untrusted binary formats, so an unmaintained status is a
# supply-chain concern rather than an exploitable one.
#
# These are ignored by ID rather than by relaxing the unmaintained policy
# wholesale, so a *different* unmaintained crate still fails the build.
#
# cargo-deny 0.20 has no `expires` field, so nothing here lapses on its own —
# these suppressions are permanent until a human deletes them. The expiry is
# therefore carried by R-013 in docs/risk-register.csv (review 2026-11-12):
# check whether Tauri has dropped urlpattern and remove whichever entries no
# longer apply. If that review is skipped, these silently persist; that is the
# known cost of ignoring by ID with this tool version.
ignore = [
    { id = "RUSTSEC-2025-0075", reason = "unic-char-property unmaintained; transitive via tauri -> tauri-utils -> urlpattern, no upgrade path. See R-013, review 2026-11-12." },
    { id = "RUSTSEC-2025-0080", reason = "unic-char-range unmaintained; same chain. See R-013, review 2026-11-12." },
    { id = "RUSTSEC-2025-0081", reason = "unic-common unmaintained; same chain. See R-013, review 2026-11-12." },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-ident / unic-ucd-version unmaintained; same chain. See R-013, review 2026-11-12." },
    { id = "RUSTSEC-2025-0100", reason = "rust-unic family unmaintained; same chain. See R-013, review 2026-11-12." },
]
