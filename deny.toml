# cargo-deny configuration.
#
# Kokin-OSINT ships source-available / proprietary (owner decision, 2026-08-12).
# A copyleft dependency entering the tree is therefore a legal problem, not a
# style preference. This file makes that a build failure instead of something
# discovered at release time.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9

# Permissive licences only. Anything not on this list must be justified in an
# ADR and added deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",       # file-level copyleft; safe when used unmodified
    "CC0-1.0",
    "Unlicense",
]

# Our own crates carry a non-SPDX identifier.
[[licenses.clarify]]
crate = "kokin-store"
expression = "MIT"
license-files = []

exceptions = [
    # OpenSSL is vendored and statically linked by SQLCipher. OpenSSL 3.x is
    # Apache-2.0; the legacy dual licence text still ships in the crate, which
    # trips the detector. Verified: openssl-src bundles OpenSSL 3.x.
    { crate = "openssl-src", allow = ["Apache-2.0", "OpenSSL"] },
    { crate = "openssl-sys", allow = ["Apache-2.0", "MIT"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Crates that must never appear, with the reason recorded so a future
# contributor does not have to rediscover it.
deny = [
    # Neo4j bindings — Neo4j Community is GPLv3/AGPLv3 and cannot be linked
    # into a source-available desktop app. This is the most common graph-storage
    # reflex and it is a trap. See ADR-0005.
    { crate = "neo4rs", reason = "Neo4j is GPL/AGPL — incompatible with our licence. Use the relational graph (ADR-0005)." },
    # Network access belongs in kokin-net only (ADR-0010). The CI privacy lint
    # catches source-level imports; this catches a transitive reintroduction.
    { crate = "openssl-probe", reason = "Implies system TLS discovery outside the egress broker." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
yanked = "deny"
ignore = []
