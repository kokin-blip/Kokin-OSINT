[workspace]
resolver = "2"
members = [
    "crates/kokin-store",
    "crates/kokin-keys",
    "crates/kokin-blob",
    "crates/kokin-net",
    "crates/kokin-ingest",
    "crates/kokin-extract",
    "crates/kokin-graph",
    "crates/kokin-search",
    "crates/kokin-export",
    "crates/kokin-ai",
    "crates/kokin-maps",
    "crates/kokin-vector-adapter",
    "crates/kokin-media",
    "crates/kokin-connectors",
    "crates/kokin-faces",
    "src-tauri",
]
# poc/ is deliberately NOT a workspace member. Proof-of-concept code must never
# be reachable from a release build (review gate 4).
exclude = ["poc", "vendor/lol_html", "vendor/time", "vendor/plist", "vendor/tokenizers"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Kokin-Source-Available"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# A panic in a parser must become an error code, never a lost case.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Preserve parser security fixes and API while honoring its declared MSRV.
[patch.crates-io]
lol_html = { path = "vendor/lol_html" }

time = {path="vendor/time"}
plist = {path="vendor/plist"}
tokenizers = {path="vendor/tokenizers"}
